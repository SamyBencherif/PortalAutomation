{% extends "_base.html" %}
{% block content %}
<div class="panel">
  <div class="panel-hd">{{ heading }}</div>
  <div class="panel-bd">
    <div class="{{ message_class }}">{{ message }}</div>

      <td>{{ code }}</td></tr></table>{% endif %}

  </div>
</div>
{% endblock %}
